[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clef"
version = "0.1.0"
description = "ECG Foundation Model (CLEF) - project metadata and dependencies"
readme = "README.md"
requires-python = ">=3.12, <3.13"

# Dependencies consolidated from requirements.txt
dependencies = [
  "matplotlib==3.10.1",
  "numpy==2.2.4",
  "pandas==2.2.3",
  "scikit_learn==1.6.1",
  "scipy==1.15.2",
  "torch==2.4.0",
  "torchvision==0.19.0",
  "tqdm==4.66.5",
  "wfdb==4.2.0",
  "einops",
  "timm",
  "lightning",
  "omegaconf",
  "PyWavelets",
  "neurokit2",
  "transformers",
  "fastai<2",
  "librosa",
  "hydra-core>=1.3.2",
  "rich==14.0.0",
]


[tool.uv]
python-preference = "3.12"
env = "clef"

# Install packages from requirements.txt (keeps dependency list in one place)
requirements = ["requirements.txt"]

# Commands uv should run after syncing the env to reproduce the conda/docker setup.
# Note: apt/system packages require root and are only relevant when running inside a
# container or on a system where you control apt. uv may or may not support running
# these; they are provided as guidance for scripts/hooks the user can run.
apt_packages = ["wget", "vim", "bzip2"]

# Post-sync commands: install python deps and the project in editable mode (same as
# the conda instructions / Dockerfile post-setup).
post_sync = [
  "python -m pip install -r requirements.txt",
  "python -m pip install -e .",
]

# Install this project in editable mode via uv packages entry if supported by your uv version
packages = [
  { path = ".", editable = true }
]

