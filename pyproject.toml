[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clef"
version = "0.1.0"
description = "ECG Foundation Model (CLEF) - project metadata and dependencies"
readme = "README.md"
requires-python = ">=3.12, <3.13"

dependencies = [
  "matplotlib==3.10.1",
  "numpy==2.2.4",
  "pandas==2.2.3",
  "scikit_learn==1.6.1",
  "scipy==1.15.2",
  "torch==2.4.0",
  "tqdm==4.66.5",
  "wfdb==4.2.0",
  "einops",
  "lightning",
  "omegaconf",
  "PyWavelets",
  "neurokit2",
  "transformers",
  "librosa",
  "hydra-core>=1.3.2",
  "rich==14.0.0",
]

